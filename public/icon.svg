<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RentOS">
  <title>RentOS</title>
  <!--
    One shape doing three jobs.

    A bicycle wheel — thin rim, ten fine spokes, small hub — because Davis rides,
    and it is how most tenants here actually arrive. Over the spokes, a meridian
    and a parallel turn the same circle into a globe: tenants from everywhere.
    The roof above is the housing.

    Spoke count is the whole design. Two earlier cuts failed on it: four spokes
    let the globe's arcs dominate and the mark read as a globe under a roof;
    three thick spokes read as a steering wheel. A bicycle wheel is identified
    by MANY THIN spokes against a thin rim, so that is what this is. Do not
    "simplify" by reducing them.

    Strokes only, on a 64px grid. The spokes go soft below about 24px, which is
    accepted: at favicon size the silhouette — circle under a roof — is what
    carries, and public/icons/* are rendered from this at real sizes anyway.
  -->
  <defs>
    <linearGradient id="rentos-brand" x1="0" y1="0" x2="1" y2="1">
      <!-- Matches .gradient-brand in globals.css: oklch(0.55 0.18 200) -> oklch(0.70 0.15 175) -->
      <stop offset="0%" stop-color="#0090B4"/>
      <stop offset="100%" stop-color="#19C2A8"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#rentos-brand)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof -->
    <path d="M10 21 L32 6.5 L54 21" stroke-width="5"/>

    <!-- Spokes -->
    <g stroke-width="1.4" opacity="0.95">
      <line x1="32.00" y1="36.50" x2="32.00" y2="24.50"/>
      <line x1="34.06" y1="37.17" x2="41.11" y2="27.46"/>
      <line x1="35.33" y1="38.92" x2="46.74" y2="35.21"/>
      <line x1="35.33" y1="41.08" x2="46.74" y2="44.79"/>
      <line x1="34.06" y1="42.83" x2="41.11" y2="52.54"/>
      <line x1="32.00" y1="43.50" x2="32.00" y2="55.50"/>
      <line x1="29.94" y1="42.83" x2="22.89" y2="52.54"/>
      <line x1="28.67" y1="41.08" x2="17.26" y2="44.79"/>
      <line x1="28.67" y1="38.92" x2="17.26" y2="35.21"/>
      <line x1="29.94" y1="37.17" x2="22.89" y2="27.46"/>
    </g>

    <!-- The world, sitting over the spokes -->
    <g stroke-width="2">
      <ellipse cx="32" cy="40" rx="7.5" ry="15.5"/>
      <ellipse cx="32" cy="40" rx="15.5" ry="7.5"/>
    </g>

    <!-- Rim -->
    <circle cx="32" cy="40" r="17" stroke-width="3.6"/>

    <!-- Hub -->
    <circle cx="32" cy="40" r="3.4" stroke-width="2.8"/>
  </g>
</svg>
