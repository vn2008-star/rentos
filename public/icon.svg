<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RentOS">
  <title>RentOS</title>
  <!--
    One shape doing three jobs.

    The circle is a bicycle wheel — Davis is a cycling town, and the bike is how
    most tenants here actually arrive. The same lines that read as spokes read
    as meridians and parallels, which makes it a globe: tenants from everywhere.
    The roof over it is the housing.

    Drawn as strokes on a 64px grid so it survives being shrunk to a 16px
    favicon: no fills to close up, no detail finer than 2px.
  -->
  <defs>
    <linearGradient id="rentos-brand" x1="0" y1="0" x2="1" y2="1">
      <!-- Matches .gradient-brand in globals.css: oklch(0.55 0.18 200) -> oklch(0.70 0.15 175) -->
      <stop offset="0%" stop-color="#0090B4"/>
      <stop offset="100%" stop-color="#19C2A8"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#rentos-brand)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof -->
    <path d="M11 21 L32 7 L53 21" stroke-width="4.5"/>

    <!-- Tyre -->
    <circle cx="32" cy="40" r="17" stroke-width="4"/>

    <!-- Spokes, which are also the globe's grid -->
    <g stroke-width="2" opacity="0.9">
      <line x1="32" y1="23" x2="32" y2="57"/>
      <line x1="15" y1="40" x2="49" y2="40"/>
      <line x1="20" y1="28" x2="44" y2="52"/>
      <line x1="44" y1="28" x2="20" y2="52"/>
      <!-- Meridian and parallel: the two arcs that turn a wheel into a world -->
      <ellipse cx="32" cy="40" rx="8" ry="17"/>
      <ellipse cx="32" cy="40" rx="17" ry="8"/>
    </g>

    <!-- Hub -->
    <circle cx="32" cy="40" r="3.2" stroke-width="3"/>
  </g>
</svg>
